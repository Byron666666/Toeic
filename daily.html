<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>每日 TOEIC 閱讀｜FlipWords</title></head>
<body>
<script>
fetch("articles.html").then(r=>r.text()).then(html=>{
  const close="</scr"+"ipt>";
  const marker='<script src="articles.js">'+close;
  const extra='<script src="articles-extra-data.js">'+close;
  const day4='<script src="articles-day004.js">'+close;
  const day5='<script src="articles-day005.js">'+close;
  const day6='<script src="articles-day006.js">'+close;
  const day7='<script src="articles-day007.js">'+close;
  const day8='<script src="articles-day008.js">'+close;
  const day9='<script src="articles-day009.js">'+close;
  const day10='<script src="articles-day010.js">'+close;
  const day11='<script src="articles-day011.js">'+close;
  const day12='<script src="articles-day012.js">'+close;
  const day13='<script src="articles-day013.js">'+close;
  const day14='<script src="articles-day014.js">'+close;
  const day15='<script src="articles-day015.js">'+close;
  const fix='<script src="articles-flip-fix.js">'+close;
  document.open();
  document.write(html.replace(marker, extra+day4+day5+day6+day7+day8+day9+day10+day11+day12+day13+day14+day15+marker+fix));
  document.close();
});
</script>
</body>
</html>
